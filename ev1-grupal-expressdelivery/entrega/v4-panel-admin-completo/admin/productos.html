<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel de administracion de ExpressDelivery: Productos">
  <title>Productos | Administrador ExpressDelivery</title>

  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/estilos.css">
</head>
<body class="admin" data-roles="Administrador,Vendedor">

  <div class="layout-admin">
        <aside class="barra-lateral">
      <a href="../index.html" class="marca">
        <img src="../assets/img/logo.png" alt="Logotipo de ExpressDelivery" class="logo-ed">
        Express<span>Delivery</span>
      </a>

      <nav aria-label="Menu del administrador">
        <p class="titulo-grupo">GENERAL</p>
        <a href="index.html" class="item-menu">Dashboard</a>
        <p class="titulo-grupo">CATALOGO</p>
        <a href="productos.html" class="item-menu activo">Productos</a>
        <a href="producto-nuevo.html" class="item-menu solo-administrador">Nuevo producto</a>
        <p class="titulo-grupo solo-administrador">PERSONAS</p>
        <a href="usuarios.html" class="item-menu solo-administrador">Usuarios</a>
        <a href="usuario-nuevo.html" class="item-menu solo-administrador">Nuevo usuario</a>

        <p class="titulo-grupo">SESION</p>
        <a href="../index.html" class="item-menu">Ir a la tienda</a>
        <a href="#" class="item-menu" id="btn-salir-admin">Cerrar sesion</a>
      </nav>

      <div class="mt-4 pt-3 border-top border-secondary">
        <p class="small mb-0" id="saludo-admin"></p>
        <p class="small text-warning mb-0">Perfil: <span id="perfil-admin"></span></p>
      </div>
    </aside>

    <main class="contenido-admin">
      <header class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <div>
          <h1 class="h3 mb-0">Productos</h1>
          <span class="small text-muted" id="total-productos"></span>
        </div>
        <a href="producto-nuevo.html" class="btn btn-ed solo-administrador">Nuevo producto</a>
      </header>

      <section class="panel-admin" aria-label="Listado de productos">
        <div class="table-responsive">
          <table class="table tabla-admin align-middle mb-0">
            <caption class="small">Listado completo de productos publicados.</caption>
            <thead>
              <tr>
                <th scope="col">Codigo</th>
                <th scope="col">Nombre</th>
                <th scope="col">Categoria</th>
                <th scope="col">Precio</th>
                <th scope="col">Stock</th>
                <th scope="col">Estado</th>
                <th scope="col" class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="cuerpo-productos"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/datos.js"></script>
  <script src="../assets/js/almacenamiento.js"></script>
  <script src="../assets/js/carrito.js"></script>
  <script src="../assets/js/validaciones.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
