<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 17 - display: block vs inline</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .bloque { display: block; background: #9ae6b4; padding: 10px; margin-bottom: 5px; }
    .en-linea { display: inline; background: #fbd38d; padding: 10px; }
</style>
</head>
<body>

<h1>Ejercicio 17: display: block vs inline</h1>
<div class="explicacion">display: block ocupa toda la linea. display: inline ocupa solo su contenido, permitiendo que otros elementos esten a su lado.</div>

<div class="demo">
<div class="bloque">Bloque</div>
<span class="en-linea">En linea 1</span>
<span class="en-linea">En linea 2</span>
</div>

</body>
</html>
