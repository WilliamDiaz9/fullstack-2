<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 14 - font-style</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .normal { font-style: normal; }
    .cursiva { font-style: italic; }
    .oblicua { font-style: oblique; }
</style>
</head>
<body>

<h1>Ejercicio 14: font-style</h1>
<div class="explicacion">La propiedad font-style define el estilo de la letra: normal, italic (cursiva) u oblique.</div>

<div class="demo">
<p class="normal">Estilo normal</p>
<p class="cursiva">Estilo cursiva</p>
<p class="oblicua">Estilo oblicuo</p>
</div>

</body>
</html>
