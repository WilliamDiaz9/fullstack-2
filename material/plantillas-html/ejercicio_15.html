<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 15 - text-decoration</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .subrayado { text-decoration: underline; }
    .tachado { text-decoration: line-through; }
    .subrayado-tachado { text-decoration: underline line-through; }
</style>
</head>
<body>

<h1>Ejercicio 15: text-decoration</h1>
<div class="explicacion">La propiedad text-decoration anade decoraciones: underline (subrayado), line-through (tachado) o ambas.</div>

<div class="demo">
<p class="subrayado">Texto subrayado</p>
<p class="tachado">Texto tachado</p>
<p class="subrayado-tachado">Subrayado y tachado</p>
</div>

</body>
</html>
