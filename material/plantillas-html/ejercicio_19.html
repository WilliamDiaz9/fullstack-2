<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 19 - letter-spacing</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .normal { letter-spacing: normal; }
    .separado { letter-spacing: 5px; }
    .muy-separado { letter-spacing: 10px; }
</style>
</head>
<body>

<h1>Ejercicio 19: letter-spacing</h1>
<div class="explicacion">La propiedad letter-spacing controla el espacio ENTRE letras. Valores positivos separan las letras.</div>

<div class="demo">
<p class="normal">Normal</p>
<p class="separado">5px</p>
<p class="muy-separado">10px</p>
</div>

</body>
</html>
