<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 24 - cursor</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .cursor-pointer { cursor: pointer; background: #9ae6b4; padding: 10px; text-align: center; margin-bottom: 5px; }
    .cursor-help { cursor: help; background: #fbd38d; padding: 10px; text-align: center; margin-bottom: 5px; }
    .cursor-move { cursor: move; background: #feb2b2; padding: 10px; text-align: center; }
</style>
</head>
<body>

<h1>Ejercicio 24: cursor</h1>
<div class="explicacion">La propiedad cursor cambia el puntero del raton al pasar por encima: pointer (mano), help (ayuda) o move (mover).</div>

<div class="demo">
<div class="cursor-pointer">Pasa el raton (pointer)</div>
<div class="cursor-help">Pasa el raton (help)</div>
<div class="cursor-move">Pasa el raton (move)</div>
</div>

</body>
</html>
