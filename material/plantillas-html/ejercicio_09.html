<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 9 - Combinando color y fondo</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .fondo-oscuro { background: #1a202c; color: white; padding: 10px; margin-bottom: 10px; }
    .fondo-claro { background: #fefcbf; color: #744210; padding: 10px; }
</style>
</head>
<body>

<h1>Ejercicio 9: Combinando color y fondo</h1>
<div class="explicacion">Combinamos color (texto) y background (fondo) para hacer elementos mas legibles con contraste.</div>

<div class="demo">
<div class="fondo-oscuro">Texto blanco fondo oscuro</div>
<div class="fondo-claro">Texto oscuro fondo claro</div>
</div>

</body>
</html>
