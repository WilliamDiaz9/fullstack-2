<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 13 - border-radius</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .sin-redondeo { border: 2px solid #4a5568; padding: 10px; margin-bottom: 10px; }
    .con-redondeo { border: 2px solid #4a5568; border-radius: 15px; padding: 10px; margin-bottom: 10px; }
    .muy-redondeado { border: 2px solid #4a5568; border-radius: 50px; padding: 10px; }
</style>
</head>
<body>

<h1>Ejercicio 13: border-radius</h1>
<div class="explicacion">La propiedad border-radius redondea las esquinas de un elemento. 15px da un redondeo suave, 50px lo hace muy redondeado.</div>

<div class="demo">
<div class="sin-redondeo">Sin redondeo</div>
<div class="con-redondeo">Con redondeo 15px</div>
<div class="muy-redondeado">Muy redondeado 50px</div>
</div>

</body>
</html>
