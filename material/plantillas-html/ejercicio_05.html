<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 5 - border</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .solido { border: 3px solid red; padding: 10px; margin-bottom: 10px; }
    .punteado { border: 3px dashed blue; padding: 10px; margin-bottom: 10px; }
    .puntos { border: 3px dotted green; padding: 10px; }
</style>
</head>
<body>

<h1>Ejercicio 5: border</h1>
<div class="explicacion">La propiedad border tiene 3 partes: grosor, estilo y color. Aqui vemos 3 estilos diferentes.</div>

<div class="demo">
<div class="solido">Solido</div>
<div class="punteado">Punteado</div>
<div class="puntos">Puntos</div>
</div>

</body>
</html>
