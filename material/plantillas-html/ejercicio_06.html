<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 6 - padding</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .sin-padding { border: 2px solid black; margin-bottom: 10px; }
    .con-padding { border: 2px solid black; padding: 20px; }
</style>
</head>
<body>

<h1>Ejercicio 6: padding</h1>
<div class="explicacion">La propiedad padding crea espacio INTERNO entre el contenido y el borde de la caja. En la segunda caja, el texto esta mas separado del borde.</div>

<div class="demo">
<div class="sin-padding">Sin padding</div>
<div class="con-padding">Con padding 20px</div>
</div>

</body>
</html>
