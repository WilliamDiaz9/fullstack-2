<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 26 - word-spacing</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .normal { word-spacing: normal; }
    .separado { word-spacing: 15px; }
    .muy-separado { word-spacing: 30px; }
</style>
</head>
<body>

<h1>Ejercicio 26: word-spacing</h1>
<div class="explicacion">La propiedad word-spacing controla el espacio ENTRE palabras. Valores positivos separan las palabras.</div>

<div class="demo">
<p class="normal">Espacio normal entre palabras</p>
<p class="separado">Espacio separado entre palabras</p>
<p class="muy-separado">Espacio muy separado entre palabras</p>
</div>

</body>
</html>
