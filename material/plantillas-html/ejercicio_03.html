<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 3 - font-size</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .pequeno { font-size: 12px; }
    .mediano { font-size: 24px; }
    .grande { font-size: 48px; }
</style>
</head>
<body>

<h1>Ejercicio 3: font-size</h1>
<div class="explicacion">La propiedad font-size controla el tamano de la letra. Se puede usar en pixeles (px), em, rem, etc. Aqui vemos 3 tamanos diferentes.</div>

<div class="demo">
<p class="pequeno">Texto pequeno</p>
<p class="mediano">Texto mediano</p>
<p class="grande">Texto grande</p>
</div>

</body>
</html>
