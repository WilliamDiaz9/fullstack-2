<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reloj DuocUC Neon</title>
    <style>

        body {
            margin: 0;
            background-color: #0a0a0f;
            text-align: center;
            padding-top: 40px;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* ====== fondo animado con circulos flotando ====== */
        .circulo {
            position: absolute;
            border-radius: 50%;
            filter: blur(15px);
            opacity: 0.5;
            z-index: 0;
        }

        .c1 {
            width: 200px;
            height: 200px;
            background-color: #f8b31c;
            top: 10%;
            left: 5%;
            animation: flotar1 6s ease-in-out infinite;
        }

        .c2 {
            width: 150px;
            height: 150px;
            background-color: #ff2ec4;
            top: 60%;
            left: 80%;
            animation: flotar2 8s ease-in-out infinite;
        }

        .c3 {
            width: 120px;
            height: 120px;
            background-color: #00eaff;
            top: 70%;
            left: 10%;
            animation: flotar3 7s ease-in-out infinite;
        }

        @keyframes flotar1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(60px, 40px); }
        }

        @keyframes flotar2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-50px, -60px); }
        }

        @keyframes flotar3 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, -50px); }
        }

        /* ====== titulo neon parpadeante ====== */
        h1 {
            position: relative;
            z-index: 1;
            font-size: 50px;
            color: #fff;
            text-shadow:
                0 0 5px #f8b31c,
                0 0 15px #f8b31c,
                0 0 30px #f8b31c,
                0 0 60px #ff2ec4;
            animation: parpadeo 2.5s infinite alternate;
        }

        @keyframes parpadeo {
            0%, 18%, 22%, 25%, 53%, 57%, 100% {
                text-shadow:
                    0 0 5px #f8b31c,
                    0 0 15px #f8b31c,
                    0 0 30px #f8b31c,
                    0 0 60px #ff2ec4;
            }
            20%, 24%, 55% {
                text-shadow: none;
            }
        }

        /* ====== reloj digital neon ====== */
        p#hora {
            position: relative;
            z-index: 1;
            font-size: 70px;
            font-family: monospace;
            color: #00eaff;
            text-shadow:
                0 0 10px #00eaff,
                0 0 25px #00eaff,
                0 0 50px #00eaff;
            animation: pulso 1.5s ease-in-out infinite;
        }

        @keyframes pulso {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ====== reloj analogico neon ====== */
        .reloj-analogico {
            position: relative;
            z-index: 1;
            width: 240px;
            height: 240px;
            border: 6px solid #f8b31c;
            border-radius: 50%;
            margin: 30px auto;
            background-color: #111;
            box-shadow:
                0 0 20px #f8b31c,
                0 0 40px #f8b31c,
                inset 0 0 20px #f8b31c;
            animation: girarBorde 10s linear infinite;
        }

        @keyframes girarBorde {
            0% { box-shadow: 0 0 20px #f8b31c, 0 0 40px #f8b31c, inset 0 0 20px #f8b31c; }
            33% { box-shadow: 0 0 20px #ff2ec4, 0 0 40px #ff2ec4, inset 0 0 20px #ff2ec4; }
            66% { box-shadow: 0 0 20px #00eaff, 0 0 40px #00eaff, inset 0 0 20px #00eaff; }
            100% { box-shadow: 0 0 20px #f8b31c, 0 0 40px #f8b31c, inset 0 0 20px #f8b31c; }
        }

        .aguja {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            border-radius: 5px;
        }

        .hora {
            width: 6px;
            height: 65px;
            margin-left: -3px;
            background-color: #f8b31c;
            box-shadow: 0 0 10px #f8b31c;
        }

        .minuto {
            width: 4px;
            height: 90px;
            margin-left: -2px;
            background-color: #00eaff;
            box-shadow: 0 0 10px #00eaff;
        }

        .segundo {
            width: 2px;
            height: 100px;
            margin-left: -1px;
            background-color: #ff2ec4;
            box-shadow: 0 0 10px #ff2ec4;
        }

        .numero {
            position: absolute;
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 0 0 8px #ffffff;
            transform: translate(-50%, -50%);
        }

        /* ====== texto en movimiento (marquee) ====== */
        .marquee {
            position: relative;
            z-index: 1;
            margin-top: 30px;
            overflow: hidden;
            white-space: nowrap;
            border-top: 2px solid #f8b31c;
            border-bottom: 2px solid #f8b31c;
            padding: 10px 0;
        }

        .marquee span {
            display: inline-block;
            padding-left: 100%;
            color: #f8b31c;
            font-size: 20px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #f8b31c;
            animation: mover 12s linear infinite;
        }

        @keyframes mover {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* ====== dinosaurio corriendo ====== */
        #dino {
            position: fixed;
            top: 50%;
            left: 50%;
            font-size: 60px;
            z-index: 2;
            transition: left 1.2s linear, top 1.2s linear;
            animation: saltar 0.3s ease-in-out infinite;
        }

        @keyframes saltar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ====== barra de "sin conexion" con el dino corriendo ====== */
        .suelo {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: #f8b31c;
            box-shadow: 0 0 10px #f8b31c;
            z-index: 2;
        }

        #dinoOffline {
            position: fixed;
            bottom: 4px;
            left: -60px;
            font-size: 40px;
            z-index: 3;
            animation: correr 10s linear infinite, saltoChico 0.2s ease-in-out infinite;
        }

        @keyframes correr {
            0% { left: -60px; }
            100% { left: 100%; }
        }

        @keyframes saltoChico {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* ====== pokemones apareciendo y desapareciendo ====== */
        .poke {
            position: fixed;
            width: 70px;
            height: 70px;
            z-index: 4;
            opacity: 0;
            pointer-events: none;
        }

        .poke.flash {
            animation: destello 1s ease-in-out;
        }

        @keyframes destello {
            0%   { opacity: 0; transform: scale(0.3); }
            20%  { opacity: 1; transform: scale(1.2); }
            80%  { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.3); }
        }

        /* ====== CAOS TOTAL ====== */

        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-10px, 5px); }
            20% { transform: translate(10px, -8px); }
            30% { transform: translate(-8px, 8px); }
            40% { transform: translate(8px, -5px); }
            50% { transform: translate(-6px, 6px); }
            60% { transform: translate(6px, -6px); }
            70% { transform: translate(-4px, 4px); }
            80% { transform: translate(4px, -4px); }
            90% { transform: translate(-2px, 2px); }
        }

        body.explotando {
            animation: shake 0.5s;
        }

        #explosion {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 120px;
            z-index: 10;
            pointer-events: none;
            opacity: 0;
        }

        #explosion.activo {
            animation: boom 0.5s ease-out;
        }

        @keyframes boom {
            0%   { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            50%  { transform: translate(-50%, -50%) scale(2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
        }

        .confeti {
            position: fixed;
            top: -20px;
            font-size: 24px;
            z-index: 9;
            animation: caer linear forwards;
        }

        @keyframes caer {
            0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0.3; }
        }

        #sesentaysiete {
            position: fixed;
            font-size: 45px;
            font-weight: bold;
            color: #39ff14;
            text-shadow: 0 0 15px #39ff14;
            z-index: 8;
            opacity: 0;
            pointer-events: none;
        }

        #sesentaysiete.mostrar {
            animation: aparecer67 1.2s ease-in-out;
        }

        @keyframes aparecer67 {
            0%   { opacity: 0; transform: scale(0) rotate(-30deg); }
            30%  { opacity: 1; transform: scale(1.4) rotate(10deg); }
            60%  { opacity: 1; transform: scale(1) rotate(0deg); }
            100% { opacity: 0; transform: scale(0.5) rotate(20deg); }
        }

        .presentador {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 60px;
            z-index: 5;
            animation: bailar 0.6s ease-in-out infinite;
        }

        @keyframes bailar {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }

        body.glitch h1 {
            animation: glitchtxt 0.3s;
        }

        @keyframes glitchtxt {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 3px); color: red; }
            40% { transform: translate(5px, -3px); color: lime; }
            60% { transform: translate(-3px, -3px); color: blue; }
            80% { transform: translate(3px, 3px); color: #fff; }
            100% { transform: translate(0); }
        }

    </style>
</head>
<body>

    <div class="suelo"></div>
    <div id="dinoOffline">🦖</div>

    <img class="poke" id="poke1">
    <img class="poke" id="poke2">
    <img class="poke" id="poke3">
    <img class="poke" id="poke4">

    <div id="explosion">💥</div>
    <div id="sesentaysiete">67</div>
    <div class="presentador">🎙️😎</div>

    <div id="dino">🦖</div>

    <div class="circulo c1"></div>
    <div class="circulo c2"></div>
    <div class="circulo c3"></div>

    <h1>DuocUC</h1>

    <p id="hora">00:00:00</p>

    <div class="reloj-analogico">
        <div class="numero" style="left: 152.5px; top: 40px;">1</div>
        <div class="numero" style="left: 200px; top: 73.5px;">2</div>
        <div class="numero" style="left: 213px; top: 120px;">3</div>
        <div class="numero" style="left: 200px; top: 166.5px;">4</div>
        <div class="numero" style="left: 152.5px; top: 200px;">5</div>
        <div class="numero" style="left: 120px; top: 213px;">6</div>
        <div class="numero" style="left: 73.5px; top: 200px;">7</div>
        <div class="numero" style="left: 40px; top: 166.5px;">8</div>
        <div class="numero" style="left: 27px; top: 120px;">9</div>
        <div class="numero" style="left: 40px; top: 73.5px;">10</div>
        <div class="numero" style="left: 73.5px; top: 40px;">11</div>
        <div class="numero" style="left: 120px; top: 27px;">12</div>

        <div class="aguja hora" id="agujaHora"></div>
        <div class="aguja minuto" id="agujaMinuto"></div>
        <div class="aguja segundo" id="agujaSegundo"></div>
    </div>

    <div class="marquee">
        <span>★ DUOCUC ★ INGENIERIA EN INFORMATICA ★ DUOCUC ★ INGENIERIA EN INFORMATICA ★</span>
    </div>

    <script>
        setInterval(function () {
            let ahora = new Date();

            // reloj digital
            document.getElementById("hora").innerHTML = ahora.toLocaleTimeString();

            // reloj analogico
            let horas = ahora.getHours();
            let minutos = ahora.getMinutes();
            let segundos = ahora.getSeconds();

            let gradosHora = (horas % 12) * 30 + minutos * 0.5;
            let gradosMinuto = minutos * 6;
            let gradosSegundo = segundos * 6;

            document.getElementById("agujaHora").style.transform = "rotate(" + gradosHora + "deg)";
            document.getElementById("agujaMinuto").style.transform = "rotate(" + gradosMinuto + "deg)";
            document.getElementById("agujaSegundo").style.transform = "rotate(" + gradosSegundo + "deg)";
        }, 1000);

        // ====== dinosaurio moviendose por toda la pantalla ======
        let dino = document.getElementById("dino");
        let ultimoX = window.innerWidth / 2;

        setInterval(function () {
            let nuevoX = Math.random() * (window.innerWidth - 80);
            let nuevoY = Math.random() * (window.innerHeight - 80);

            // si se mueve hacia la izquierda, lo damos vuelta para que mire hacia alla
            if (nuevoX < ultimoX) {
                dino.style.transform = "scaleX(-1)";
            } else {
                dino.style.transform = "scaleX(1)";
            }

            dino.style.left = nuevoX + "px";
            dino.style.top = nuevoY + "px";

            ultimoX = nuevoX;
        }, 1500);

        // ====== pokemones apareciendo y desapareciendo ======
        let sprites = [
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png",  // Pikachu
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png",   // Bulbasaur
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png",   // Charmander
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/7.png",   // Squirtle
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/133.png", // Eevee
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/39.png"   // Jigglypuff
        ];

        let pokes = [
            document.getElementById("poke1"),
            document.getElementById("poke2"),
            document.getElementById("poke3"),
            document.getElementById("poke4")
        ];

        setInterval(function () {
            // elegimos un pokemon al azar de la lista de imagenes
            let img = sprites[Math.floor(Math.random() * sprites.length)];

            // elegimos uno de los 4 "espacios" en pantalla al azar
            let poke = pokes[Math.floor(Math.random() * pokes.length)];

            // posicion al azar dentro de la pantalla
            let x = Math.random() * (window.innerWidth - 70);
            let y = Math.random() * (window.innerHeight - 150);

            poke.src = img;
            poke.style.left = x + "px";
            poke.style.top = y + "px";

            // truco para poder reiniciar la animacion aunque ya la tenga puesta
            poke.classList.remove("flash");
            void poke.offsetWidth;
            poke.classList.add("flash");
        }, 600);

        // ====== el reloj "explota" cada 5 segundos ======
        setInterval(function () {
            document.body.classList.add("explotando");
            document.getElementById("explosion").classList.add("activo");

            setTimeout(function () {
                document.body.classList.remove("explotando");
                document.getElementById("explosion").classList.remove("activo");
            }, 500);
        }, 5000);

        // ====== aparece un "67" en un lugar random cada cierto tiempo ======
        setInterval(function () {
            let el = document.getElementById("sesentaysiete");
            let x = Math.random() * (window.innerWidth - 80);
            let y = Math.random() * (window.innerHeight - 80);

            el.style.left = x + "px";
            el.style.top = y + "px";

            el.classList.remove("mostrar");
            void el.offsetWidth;
            el.classList.add("mostrar");
        }, 2000);

        // ====== confeti cayendo todo el rato ======
        let emojisConfeti = ["🎉", "⭐", "🔥", "💛", "✨", "🦖"];

        setInterval(function () {
            let pieza = document.createElement("div");
            pieza.className = "confeti";
            pieza.innerHTML = emojisConfeti[Math.floor(Math.random() * emojisConfeti.length)];
            pieza.style.left = Math.random() * window.innerWidth + "px";
            pieza.style.animationDuration = (2 + Math.random() * 2) + "s";
            document.body.appendChild(pieza);

            // se elimina solo despues de caer, para no acumular elementos infinitos
            setTimeout(function () {
                pieza.remove();
            }, 4000);
        }, 300);

        // ====== glitch random en el titulo ======
        setInterval(function () {
            document.body.classList.add("glitch");
            setTimeout(function () {
                document.body.classList.remove("glitch");
            }, 300);
        }, 3000);
    </script>

</body>
</html>
