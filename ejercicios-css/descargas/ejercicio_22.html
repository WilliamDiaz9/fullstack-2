<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 22 - opacity</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .opaco { background: #4299e1; padding: 15px; opacity: 1; margin-bottom: 5px; color: white; }
    .transparente { background: #4299e1; padding: 15px; opacity: 0.5; margin-bottom: 5px; color: white; }
    .muy-transparente { background: #4299e1; padding: 15px; opacity: 0.2; color: white; }
</style>
</head>
<body>

<h1>Ejercicio 22: opacity</h1>
<div class="explicacion">La propiedad opacity controla la transparencia de un elemento. Va de 1 (opaco) a 0 (totalmente transparente).</div>

<div class="demo">
<div class="opaco">Opaco (1)</div>
<div class="transparente">Transparente (0.5)</div>
<div class="muy-transparente">Muy transparente (0.2)</div>
</div>

</body>
</html>
