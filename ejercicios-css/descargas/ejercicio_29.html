<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 29 - max-width</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .maxwidth { max-width: 300px; background: #9ae6b4; padding: 15px; width: 100%; }
</style>
</head>
<body>

<h1>Ejercicio 29: max-width</h1>
<div class="explicacion">La propiedad max-width establece el ancho MAXIMO de un elemento. Es ideal para disenos responsivos porque la caja no crece mas de ese limite.</div>

<div class="demo">
<div class="maxwidth">Esta caja tiene max-width: 300px. No crece mas de 300px aunque la pantalla sea mas grande.</div>
</div>

</body>
</html>
