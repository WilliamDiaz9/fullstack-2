<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 27 - vertical-align</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .super { vertical-align: super; font-size: 0.7rem; }
    .sub { vertical-align: sub; font-size: 0.7rem; }
</style>
</head>
<body>

<h1>Ejercicio 27: vertical-align</h1>
<div class="explicacion">La propiedad vertical-align alinea texto en linea: super (superindice) o sub (subindice).</div>

<div class="demo">
<p>Texto normal <span class="super">superindice</span></p>
<p>Texto normal <span class="sub">subindice</span></p>
</div>

</body>
</html>
