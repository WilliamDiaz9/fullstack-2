<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 18 - list-style-type</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .circulo { list-style-type: circle; }
    .cuadrado { list-style-type: square; }
    .numeros { list-style-type: decimal; }
</style>
</head>
<body>

<h1>Ejercicio 18: list-style-type</h1>
<div class="explicacion">La propiedad list-style-type cambia el estilo de las vinetas: circle, square o decimal (numeros).</div>

<div class="demo">
<ul class="circulo">
  <li>Elemento 1</li>
  <li>Elemento 2</li>
</ul>
<ul class="cuadrado">
  <li>Elemento 1</li>
  <li>Elemento 2</li>
</ul>
<ul class="numeros">
  <li>Elemento 1</li>
  <li>Elemento 2</li>
</ul>
</div>

</body>
</html>
