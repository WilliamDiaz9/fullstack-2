<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 11 - width (ancho)</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .ancho-fijo { width: 200px; background: #9ae6b4; padding: 5px; margin-bottom: 5px; }
    .ancho-porcentaje { width: 50%; background: #fbd38d; padding: 5px; margin-bottom: 5px; }
    .ancho-auto { width: auto; background: #feb2b2; padding: 5px; }
</style>
</head>
<body>

<h1>Ejercicio 11: width (ancho)</h1>
<div class="explicacion">La propiedad width define el ancho de un elemento. Puede ser en pixeles (fijo), en porcentaje (%) o auto.</div>

<div class="demo">
<div class="ancho-fijo">200px fijos</div>
<div class="ancho-porcentaje">50%</div>
<div class="ancho-auto">auto</div>
</div>

</body>
</html>
