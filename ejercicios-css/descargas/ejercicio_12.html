<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 12 - height (altura)</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .altura-fija { height: 80px; background: #9ae6b4; padding: 5px; margin-bottom: 10px; }
    .altura-auto { height: auto; background: #fbd38d; padding: 5px; }
</style>
</head>
<body>

<h1>Ejercicio 12: height (altura)</h1>
<div class="explicacion">La propiedad height define la altura de un elemento. Puede ser fija (en pixeles) o auto.</div>

<div class="demo">
<div class="altura-fija">Altura fija 80px</div>
<div class="altura-auto">Altura automatica</div>
</div>

</body>
</html>
