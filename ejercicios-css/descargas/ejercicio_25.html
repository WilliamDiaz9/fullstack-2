<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 25 - text-transform</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .minusculas { text-transform: lowercase; }
    .mayusculas { text-transform: uppercase; }
    .capitalizar { text-transform: capitalize; }
</style>
</head>
<body>

<h1>Ejercicio 25: text-transform</h1>
<div class="explicacion">La propiedad text-transform transforma el texto: lowercase (minusculas), uppercase (mayusculas) o capitalize (primera letra mayuscula).</div>

<div class="demo">
<p class="minusculas">TEXTO EN MAYUSCULAS</p>
<p class="mayusculas">texto en minusculas</p>
<p class="capitalizar">texto con capitalizacion</p>
</div>

</body>
</html>
