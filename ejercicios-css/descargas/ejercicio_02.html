<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 2 - background-color</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .contenedor { background-color: #f0f0f0; padding: 15px; }
    .demo h2 { background-color: yellow; padding: 5px; }
</style>
</head>
<body>

<h1>Ejercicio 2: background-color</h1>
<div class="explicacion">La propiedad background-color cambia el color de fondo de cualquier elemento. Aqui el contenedor tiene fondo gris claro y el titulo tiene fondo amarillo.</div>

<div class="demo">
<div class="contenedor">
  <h2>Titulo con fondo</h2>
  <p>Texto normal</p>
</div>
</div>

</body>
</html>
