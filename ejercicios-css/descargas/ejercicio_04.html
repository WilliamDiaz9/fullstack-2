<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 4 - text-align</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .izquierda { text-align: left; }
    .centro { text-align: center; }
    .derecha { text-align: right; }
</style>
</head>
<body>

<h1>Ejercicio 4: text-align</h1>
<div class="explicacion">La propiedad text-align alinea el texto horizontalmente: left (izquierda), center (centro) y right (derecha).</div>

<div class="demo">
<p class="izquierda">Izquierda</p>
<p class="centro">Centro</p>
<p class="derecha">Derecha</p>
</div>

</body>
</html>
