<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 7 - margin</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .sin-margen { background: lightblue; padding: 5px; }
    .con-margen { background: lightblue; margin: 30px; padding: 5px; }
</style>
</head>
<body>

<h1>Ejercicio 7: margin</h1>
<div class="explicacion">La propiedad margin crea espacio EXTERNO entre cajas. La segunda caja tiene margin: 30px, por eso se separa de los bordes.</div>

<div class="demo">
<div class="sin-margen">Sin margen</div>
<div class="con-margen">Con margen 30px</div>
</div>

</body>
</html>
