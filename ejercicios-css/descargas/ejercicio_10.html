<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 10 - font-family y font-weight</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .serif { font-family: Georgia, serif; }
    .sans { font-family: Arial, sans-serif; }
    .negrita { font-weight: bold; }
</style>
</head>
<body>

<h1>Ejercicio 10: font-family y font-weight</h1>
<div class="explicacion">font-family cambia el tipo de letra. font-weight controla el grosor: bold (negrita).</div>

<div class="demo">
<p class="serif">Letra Serif</p>
<p class="sans">Letra Sans</p>
<p class="negrita">Texto en negrita</p>
</div>

</body>
</html>
