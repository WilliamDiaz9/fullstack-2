<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 21 - box-shadow</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .sin-sombra { border: 2px solid #4a5568; padding: 15px; margin-bottom: 15px; }
    .con-sombra { border: 2px solid #4a5568; padding: 15px; margin-bottom: 15px; box-shadow: 5px 5px 15px rgba(0,0,0,0.3); }
    .sombra-fuerte { border: 2px solid #4a5568; padding: 15px; box-shadow: 10px 10px 25px rgba(0,0,0,0.5); }
</style>
</head>
<body>

<h1>Ejercicio 21: box-shadow</h1>
<div class="explicacion">La propiedad box-shadow anade sombras a las cajas. Los valores son: desplazamiento horizontal, vertical, desenfoque y color.</div>

<div class="demo">
<div class="sin-sombra">Sin sombra</div>
<div class="con-sombra">Con sombra suave</div>
<div class="sombra-fuerte">Sombra fuerte</div>
</div>

</body>
</html>
