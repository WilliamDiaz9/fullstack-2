<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 8 - padding vs margin</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
    }
    .explicacion {
        background: #eef2ff;
        border-left: 4px solid #4338ca;
        padding: 12px 16px;
        margin-bottom: 25px;
        font-size: 15px;
    }
    .demo {
        border: 2px dashed #999;
        padding: 20px;
        margin-top: 10px;
    }
    h1 {
        font-size: 22px;
        color: #4338ca;
    }
    .caja { border: 3px solid purple; background: #f3e8ff; }
    .padding { padding: 20px; }
    .margin { margin: 20px 0; }
</style>
</head>
<body>

<h1>Ejercicio 8: padding vs margin</h1>
<div class="explicacion">Padding es espacio DENTRO de la caja. Margin es espacio FUERA de la caja.</div>

<div class="demo">
<div class="caja padding">Solo padding</div>
<div class="caja margin">Solo margin</div>
</div>

</body>
</html>
